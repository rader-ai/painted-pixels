<!doctype html>
<!--
  Dusk at the cabin. To use this: keep the <header> and the two scripts, put your site in <main>,
  and set --page below to your page colour. Everything is in this one file; it loads nothing.
  The first script is the Painted Pixels kit, unchanged but for SW = 480. The second is the place.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1138">
<title>Dusk at the cabin</title>
<style>
  /* --page is the colour of the page below the scene; the snow nearest us is painted in it, so
     the two run together with no edge. Change it and the near snow changes with it. */
  :root { --page: #101233; }
  html, body { margin: 0; background: var(--page); }
  .hero { position: relative; overflow: hidden; line-height: 0;
          background: linear-gradient(#171848, #4b3278 34%, #b45782 58%, #6e6dad 72%, var(--page) 96%); }
  .hero canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
  main { min-height: 40vh; }   /* the empty space is only there so the page can scroll; your content replaces it */
</style>
</head>
<body>
<header class="hero">
  <i id="splash" hidden></i>
  <canvas id="world" role="img" aria-label="A small log cabin on a snowy hillside at dusk. Someone in a red hat sits on the porch by a lantern, holding a steaming mug and looking out across a frozen lake to the last light behind the mountains. Snow is falling."></canvas>
</header>
<main>
  <!-- your site goes here -->
</main>
<script>
// Painted Pixels kit: the painting toolkit from Lofi Studio, in one file. MIT licensed, like the app.
// Generated by scripts/build-kit.mjs from Lofi Studio's index.html; change it there, not here.
//
// A plain script: load it with a script tag, or paste it inline, and everything below is in scope
// for the scripts after it. assets/starter.html shows a complete small world built on it, and
// references/ explains how and why each part is painted the way it is. references/kit-index.md
// lists everything in this file, with line numbers.
//
// Things the app normally provides. Set them from your own page as you need to.
const SW = 480, SH = 150;                     // the scene grid, in logical pixels (the canvas is twice this)
const WALL_Y = 124, STRIDE = 5;               // STRIDE: ground moved per step
const scene = {heroX: 0, heroY: 0, beat: 0, q: 0, flash: 0, step: 0, scroll: 0, walk: 0, nudge: 0, speed: 0, notes: []};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let ledMode = reduceMotion;                   // true: nothing flashes with the beat
let playing = false;                          // true while your music (if you have any) plays
const state = {bpm: 72, layers: {rain: {on: false}}};   // layers.rain.on: outdoorRain() draws rain while it's true
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pst = {};                               // per-scene state for anything that drifts or waits
const drifting = (key, n, make) => pst[key] ||= Array.from({length: n}, (_, i) => make(i));
const flashy = () => ledMode ? 0 : scene.beat;
// what the little visualisers read; without music it's a slow idle ripple
function spectrum(n, t){ return Array.from({length: n}, (_, i) => .12 + .08 * Math.sin(t * 2 + i * .7)); }
// cached layers: give a place sky(p), bg(p) and front(p) painters, and these paint each once
const PLACES = {};
const PLACE_BG = {}, PLACE_SKY = {}, PLACE_FG = {};
const placeBg = id => PLACE_BG[id] ||= (() => { const p = painter(); PLACES[id].bg(p); return p.canvas(); })();
const placeSky = id => PLACE_SKY[id] ||= (() => { const p = painter(); PLACES[id].sky(p); return p.canvas(); })();
const placeFg = id => PLACE_FG[id] ||= (() => { const p = painter(); PLACES[id].front(p); return p.canvas(); })();

// ======== random numbers ========
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ======== the painter ========
const HD = 2, DW = SW * HD, DH = SH * HD;
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => v / 16 - .47);
const bay = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];

function hash2(x, y, s){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, sc, seed){
  const xi = Math.floor(x / sc), yi = Math.floor(y / sc), fx = x / sc - xi, fy = y / sc - yi;
  const a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed), c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
// value noise that repeats exactly every W pixels, for layers that tile horizontally
function vnoiseWrap(x, y, sc, seed, W){
  const P = Math.max(1, Math.round(W / sc)), sx = W / P;
  const xf = x / sx, yf = y / sc, xi = Math.floor(xf), yi = Math.floor(yf), fx = xf - xi, fy = yf - yi;
  const x0 = ((xi % P) + P) % P, x1 = (x0 + 1) % P;
  const a = hash2(x0, yi, seed), b = hash2(x1, yi, seed), c = hash2(x0, yi + 1, seed), d = hash2(x1, yi + 1, seed);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
const RGBC = {};
function rgb(c){
  if (Array.isArray(c)) return c;
  if (RGBC[c]) return RGBC[c];
  let v;
  if (c[0] === '#') v = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16), 1];
  else { const m = c.match(/[\d.]+/g).map(Number); v = [m[0], m[1], m[2], m[3] ?? 1]; }
  return RGBC[c] = v;
}
const mixA = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, 1];
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

// Colour ramps, dark → light, shadows lean blue/purple and highlights lean warm.
const R_LEAF   = ['#173028','#22482e','#2f6434','#46843a','#68a442','#97c650','#c8e470'];
const R_WOOD   = ['#22140f','#3a2218','#56341f','#734a2a','#93643a','#b8844e'];
const R_WOODL  = ['#3a2218','#5a3824','#7a5030','#9a6a3e','#bc8a52','#dcac6c'];
const R_STONE  = ['#2a2640','#433e5a','#5e5878','#807a98','#a6a0ba','#cac6d8'];
const R_IRON   = ['#0e0c16','#1c1a2a','#2e2c40','#4a4860'];
const R_SAND   = ['#a07a58','#bc9468','#d2aa78','#e4c08a','#f2d6a4','#fbe8c4'];
const C_DAY    = ['#6e7cb8','#94a4d4','#bccbe8','#e0e8f6','#ffffff'];
const C_SUNSET = ['#4a2e64','#7a4474','#b86478','#e8907e','#ffc29a','#ffe6c4'];
const C_NIGHT  = ['#0e1230','#161c40','#222a54','#343e6c','#4c5884'];
const C_MOONLIT = ['#0a0e2a','#121838','#1c2448','#2a3460','#3e4c7c','#6a7cac','#b4c2e8'];

// How far a pixel is outside a rounded box, in canvas pixels: negative inside
const sdBox = (X, Y, x0, y0, x1, y1, r = 0) => {
  const qx = Math.abs(X + .5 - (x0 + x1) / 2) - (x1 - x0) / 2 + r, qy = Math.abs(Y + .5 - (y0 + y1) / 2) - (y1 - y0) / 2 + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
};
function painter(w = DW, h = DH, opts = {}){
  const wrap = !!opts.wrap;
  const img = new ImageData(w, h), d = img.data;
  const put = (X, Y, c) => {
    if (wrap) X = ((X % w) + w) % w;
    if (X < 0 || Y < 0 || X >= w || Y >= h) return;
    const i = (Y * w + X) << 2, a = c[3];
    if (a >= 1){ d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
    else if (a > 0){
      if (d[i + 3] === 0){ d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255 * a; }
      else { d[i] += (c[0] - d[i]) * a; d[i + 1] += (c[1] - d[i + 1]) * a; d[i + 2] += (c[2] - d[i + 2]) * a; d[i + 3] = Math.max(d[i + 3], 255 * a); }
    }
  };
  const get = (X, Y) => { if (wrap) X = ((X % w) + w) % w; const i = (Y * w + X) << 2; return [d[i], d[i + 1], d[i + 2], 1]; };
  const R = v => Math.round(v * HD);
  // in wrap mode, drawing and noise repeat across the width so the layer tiles seamlessly
  const hsh = wrap ? (X, Y, sd) => hash2(((X % w) + w) % w, Y, sd) : hash2;
  const noise = wrap ? (x, y, sc, sd) => vnoiseWrap(x, y, sc, sd, w) : vnoise;
  const ramp = cols => cols.map(rgb);
  const pick = (rp, v, X, Y) => rp[Math.max(0, Math.min(rp.length - 1, Math.floor(v * rp.length + bay(X, Y))))];
  const box = (x, y, ww, hh) => [R(x), R(y), R(x) + Math.max(1, R(ww)), R(y) + Math.max(1, R(hh))];

  const p = {
    put, get, w, h, noise, hsh, pick, ramp,
    sun: -1,   // which side bevels and domes are lit from: -1 left, 1 right
    // cuts back to nothing, so that whatever's drawn behind this layer shows through: a window in a wall
    clear(x, y, ww, hh){ const [X0, Y0, X1, Y1] = box(x, y, ww, hh); for (let Y = Math.max(0, Y0); Y < Math.min(h, Y1); Y++) for (let X = Math.max(0, X0); X < Math.min(w, X1); X++) d[((Y * w + X) << 2) + 3] = 0; },
    // Something solid, in canvas pixels, along a ramp. shape(X, Y) says how far outside it a pixel is, negative inside
    // (sdBox makes one). Near its edge it turns toward the light or away, over `round` pixels, so it has a form and not just
    // an outline. o: base, how light its face is; gain, how much its edges catch; lx, ly, which way the light is; shade(X, Y), anything more.
    form(X0, Y0, X1, Y1, cols, shape, o = {}){
      const rp = ramp(cols), {base = .5, gain = .45, lx = -.6, ly = -.8, round = 3, shade} = o;
      for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++){
        const sd = shape(X, Y);
        if (sd > 0) continue;
        const nx = shape(X + 1, Y) - shape(X - 1, Y), ny = shape(X, Y + 1) - shape(X, Y - 1), n = Math.hypot(nx, ny) || 1, e = Math.max(0, 1 + sd / round);
        put(X, Y, pick(rp, base + (nx * lx + ny * ly) / n * e * e * gain + (shade ? shade(X, Y) : 0), X, Y));
      }
    },
    canvas(){ const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').putImageData(img, 0, 0); return c; },
    // A lawn of grass tufts: little fans of pointed blades, planted from the back to the
    // front so nearer tufts overlap farther ones. They grow from tiny V's at the back to
    // big two-tone fans at the front. Their colour follows the light across the lawn (a
    // sunlit back, darker grass toward the viewer, gentle swells), and opts.light(x, y)
    // can add or take away light for tree shade or a lamp's pool. edge(x) gives the lawn's
    // top (logical) for each column. cols: [deep, dark, mid, light, bright, tip].
    lawn(edge, cols, seed, opts = {}){
      const rp = ramp(cols), r = mulberry32(seed + 1), tops = new Int32Array(w), cl = X => Math.max(0, Math.min(w - 1, X | 0));
      let minTop = h;
      for (let X = 0; X < w; X++){ tops[X] = Math.round(edge(X / HD) * HD); minTop = Math.min(minTop, tops[X]); }
      const span = Math.max(1, h - minTop);
      const light = (X, Y) => (opts.base ?? .62) - Math.max(0, Y - tops[cl(X)]) / span * (opts.fade ?? .35)
        + (noise(X * .4, Y * 1.6, 90, seed) - .5) * (opts.swell ?? .35) + (opts.light ? opts.light(X / HD, Y / HD) : 0);
      const lev = (X, Y) => Math.max(0, Math.min(3, Math.floor(light(X, Y) * 4)));
      for (let X = 0; X < w; X++) for (let Y = Math.max(0, tops[X]); Y < h; Y++) put(X, Y, rp[lev(X, Y)]);
      const list = [];
      for (let y = minTop; y < h + 12;){
        const near = Math.max(0, (y - minTop) / span), size = (opts.small ?? 4) + near * (opts.tall ?? 10), ch = size * .55, cw = size * 1.5;
        for (let x = -cw * r(); x < w; x += cw * (.8 + r() * .4)){
          const X = Math.round(x + (r() - .5) * cw * .5), Y = Math.round(y + r() * ch);
          if (X >= 0 && X < w && Y > tops[X] + 1) list.push([X, Y, size * (.75 + r() * .5)]);
        }
        y += ch;
      }
      list.sort((a, b) => a[1] - b[1]);
      const clip = (x, y, c) => { if (y >= tops[cl(x)]) put(x, y, c); };
      for (const [X, Y, size] of list) grassFan(clip, rp, X, Y, size, lev(X, Y), (r() - .5) * .5 + (opts.lean || 0), r);
    },
    // turned earth: a dark bed scattered with little lit clods and the odd pebble
    soil(x, y, ww, hh, seed){
      const [X0, Y0, X1, Y1] = box(x, y, ww, hh), r = mulberry32(seed), rp = ramp(['#24140c','#33200f','#4a2e1a','#6a4428','#8a5e38']);
      for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++) put(X, Y, rp[(noise(X, Y * 2, 6, seed) > .55) + (Y > Y1 - 2 ? 0 : 1)]);
      for (let i = 0, n = Math.round((X1 - X0) * (Y1 - Y0) / 9); i < n; i++){
        const X = X0 + Math.floor(r() * (X1 - X0)), Y = Y0 + Math.floor(r() * (Y1 - Y0)), w = 1 + Math.floor(r() * 3);
        if (r() < .08){ put(X, Y, rgb('#8a8296')); put(X + 1, Y, rgb('#6a6476')); continue; }
        for (let j = 0; j < w; j++){ put(X + j, Y, rp[j === 0 ? 4 : 3]); put(X + j, Y + 1, rp[0]); }
      }
    },
    // a patch of leaves painted in place (ivy on a wall, a creeper): leaf clumps that don't sway
    leaves(cx, cy, rx, ry, pal, seed, sun = -1){
      for (const c of shadeClumps(crownClumps(cx, cy, rx, ry, seed, pal), cx, cy, rx, ry, sun)){
        const cv = leafClump(c.r, c.pal, c.variant, c.shade, null, sun);
        p.blit(cv, c.cx, c.cy, cv.M);
      }
    },
    // copy a sprite canvas into the buffer (x, y logical, top-left of the sprite's content)
    blit(cv, x, y, margin = 3){
      const sd = cv._px ||= cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      const X0 = Math.round(x * HD - margin), Y0 = Math.round(y * HD - margin);
      for (let j = 0; j < cv.height; j++) for (let i = 0; i < cv.width; i++){
        const o = (j * cv.width + i) * 4;
        if (sd[o + 3]) put(X0 + i, Y0 + j, [sd[o], sd[o + 1], sd[o + 2], sd[o + 3] / 255]);
      }
    },
    // Paint a whole place over its sky, reflections and all, then cut the sky back out, so
    // stars, moon and clouds can move behind what's left: snapshot() right after the sky,
    // then cutTo() compares against it and clears whatever is still bare sky above row maxY.
    snapshot(){ return d.slice(); },
    cutTo(snap, maxY, x0 = 0, x1 = w / HD, y0 = 0){
      for (let Y = R(y0); Y < R(maxY); Y++) for (let X = R(x0); X < R(x1); X++){
        const i = (Y * w + X) * 4;
        if (d[i] === snap[i] && d[i + 1] === snap[i + 1] && d[i + 2] === snap[i + 2]) d[i + 3] = 0;
      }
    },
    // rows of letters, one to a canvas pixel, painted with a palette ('.' leaves what's there)
    pixels(rows, pal, x, y){
      const X0 = R(x), Y0 = R(y);
      rows.forEach((row, j) => { for (let i = 0; i < row.length; i++){ const c = pal[row[i]]; if (c) put(X0 + i, Y0 + j, rgb(c)); } });
    },
    rect(x, y, ww, hh, c){ const col = rgb(c), [X0, Y0, X1, Y1] = box(x, y, ww, hh); for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++) put(X, Y, col); },
    dot(x, y, c){ put(R(x), R(y), rgb(c)); },
    circle(cx, cy, r, c, dith){
      const col = rgb(c), X0 = R(cx), Y0 = R(cy), rr = Math.max(1, R(r));
      for (let y = -rr; y <= rr; y++) for (let x = -rr; x <= rr; x++)
        if (x*x + y*y <= rr*rr && (!dith || ((x + y) & 1) === 0)) put(X0 + x, Y0 + y, col);
    },
    ellipse(cx, cy, rx, ry, c, dith){
      const col = rgb(c), X0 = R(cx), Y0 = R(cy), RX = Math.max(1, R(rx)), RY = Math.max(1, R(ry));
      for (let y = -RY; y <= RY; y++) for (let x = -RX; x <= RX; x++)
        if ((x*x)/(RX*RX) + (y*y)/(RY*RY) <= 1 && (!dith || ((x + y) & 1) === 0)) put(X0 + x, Y0 + y, col);
    },
    // smooth gradient: each pair of colours gets two in-between steps, then ordered dither
    sky(cols, y0, y1, x0 = 0, ww = SW){
      const base = ramp(cols), steps = [];
      for (let i = 0; i < base.length - 1; i++) for (let s = 0; s < 3; s++) steps.push(mixA(base[i], base[i + 1], s / 3));
      steps.push(base[base.length - 1]);
      const [X0, Y0, X1, Y1] = box(x0, y0, ww, y1 - y0);
      for (let Y = Y0; Y < Y1; Y++){
        const pos = (Y - Y0) / (Y1 - Y0) * (steps.length - 1);
        for (let X = X0; X < X1; X++) put(X, Y, steps[Math.max(0, Math.min(steps.length - 1, Math.floor(pos + .5 + bay(X, Y))))]);
      }
    },
    texture(x, y, ww, hh, cols, scale, seed, bias = 0){
      const rp = ramp(cols), [X0, Y0, X1, Y1] = box(x, y, ww, hh);
      for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++)
        put(X, Y, pick(rp, noise(X, Y, scale * HD, seed) * .8 + hsh(X, Y, seed) * .2 + bias - .1, X, Y));
    },
    // bevelled block: light top/left, dark bottom/right; cols = [dark, base, light]
    box(x, y, ww, hh, cols, outline){
      const [dk, bs, lt] = ramp(cols), [X0, Y0, X1, Y1] = box(x, y, ww, hh), near = p.sun < 0 ? X0 : X1 - 1, far = p.sun < 0 ? X1 - 1 : X0;
      for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++)
        put(X, Y, (Y === Y0 || X === near) ? lt : (Y === Y1 - 1 || X === far) ? dk : bs);
      if (outline){
        const o = rgb(outline);
        for (let X = X0 - 1; X <= X1; X++){ put(X, Y0 - 1, o); put(X, Y1, o); }
        for (let Y = Y0; Y < Y1; Y++){ put(X0 - 1, Y, o); put(X1, Y, o); }
      }
    },
    wood(x, y, ww, hh, cols, seed, vertical){
      const rp = ramp(cols), [X0, Y0, X1, Y1] = box(x, y, ww, hh), near = p.sun < 0 ? X0 : X1 - 1, far = p.sun < 0 ? X1 - 1 : X0;
      for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++){
        const gr = vertical ? noise(X * 4, Y * .5, 10, seed) : noise(X * .5, Y * 4, 10, seed);
        let v = .2 + gr * .55;
        if (Y === Y0 || X === near) v = .92; else if (Y === Y1 - 1 || X === far) v = .02;
        put(X, Y, pick(rp, v, X, Y));
      }
    },
    strands(cx, topY, rx, len, cols, seed){
      const rp = ramp(cols), CX = R(cx), RX = R(rx), T = R(topY);
      for (let X = CX - RX; X <= CX + RX; X += 2){
        if (hsh(X, 1, seed) > .7) continue;
        const L = Math.round(R(len) * (.35 + .65 * hsh(X, 2, seed)) * (1 - Math.abs((X - CX) / RX) * .5));
        for (let j = 0; j < L; j++){
          const sx = X + Math.round(Math.sin(j * .07 + X) * 1.2), v = .95 - j / L * .75;
          put(sx, T + j, pick(rp, v, sx, T + j)); put(sx + 1, T + j, pick(rp, v - .2, sx + 1, T + j));
        }
      }
    },
    hill(fn, cols, seed, opts = {}){
      const rp = ramp(cols), n = rp.length, rim = opts.rim && rgb(opts.rim);
      for (let X = 0; X < w; X++){
        const top = R(fn(X / HD));
        // opts.sunX: a slope facing the light catches it, and one facing away falls into shade
        const face = opts.sunX === undefined ? 0 : clamp((fn((X + 6) / HD) - fn((X - 6) / HD)) / (6 / HD * 2) * Math.sign(opts.sunX - X / HD) * (opts.slope ?? 4), -1, 1);
        for (let Y = top; Y < h; Y++){
          const depth = Math.min(1, (Y - top) / R(opts.depth || 30));
          put(X, Y, pick(rp, .9 - depth * .65 + (noise(X, Y, 8, seed) - .5) * (opts.rough ?? .45) + face * .3 * (1 - depth * .4), X, Y));
        }
        if (rim) put(X, top, rim);
        if (opts.blades && hsh(X, 3, seed) < .5){
          const bh = 1 + Math.floor(hsh(X, 4, seed) * 4);

    // A pine: overlapping tiers of boughs, each a little wider than the one above, their
    // lower edges ragged with drooping needle tips. Light comes from one side (opts.sun:
    // -1 left, 1 right), catching the edges of the boughs on that side; each tier is
    // darker underneath where the one below tucks under it. cols: dark → light.
    // opts.moon {x} lights each tree from wherever the moon is, fading with distance from it.
    // opts.fire {x, y, r, col} warms the side of the tree that faces a fire.

      const sun = moon ? (x < moon.x ? 1 : -1) : opts.sun ?? -1, shine = moon ? Math.max(.3, 1 - Math.abs(x - moon.x) / 260) * Math.min(1, Math.abs(x - moon.x) / 16 + .25) : 1;
      const warm = fire && rgb(fire.col);
      for (let Y = B - R(3); Y < B; Y++) for (let X = CX - 1; X <= CX + 1; X++) put(X, Y, rp[X === CX + sun ? Math.min(n - 1, 1) : 0]);
      const tiers = Math.max(3, Math.round(H / 13)), top = B - H, body = H - R(3);
      for (let i = 0; i < tiers; i++){

        const w = Math.max(2, Math.round((i + 1.2) / tiers * H * .17 + 1)), th = y1 - y0;

const GLOWS = new Map();
function glowSprite(rx, ry, c){
  const W = Math.round(rx * HD) * 2 + 1, H = Math.round(ry * HD) * 2 + 1, key = `${W}|${H}|${c}`;   // by its real size, or a flickering fire makes a new one every frame

    const dd = Math.sqrt(((x - RX) ** 2) / (RX * RX) + ((y - RY) ** 2) / (RY * RY));
    if (dd >= 1) continue;
    const al = Math.floor((Math.pow(1 - dd, 1.5) * 5 + bay(x, y) * .9)) / 5;
    if (al > 0) p.put(x, y, [col[0], col[1], col[2], Math.min(1, al)]);

// Pixel-art 2× upscale (EPX) so sprites get smooth diagonals, then automatic
// light-on-top / shade-underneath so they read as shaded rather than flat.
function epx(rows){
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const at = (x, y) => (y < 0 || y >= h || x < 0 || x >= w) ? '.' : (rows[y][x] || '.');
  const out = Array.from({length: h * 2}, () => Array(w * 2).fill('.'));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const P = at(x, y), A = at(x, y - 1), B = at(x + 1, y), C = at(x - 1, y), D = at(x, y + 1);
    let o1 = P, o2 = P, o3 = P, o4 = P;
    if (C === A && C !== D && A !== B) o1 = A;
    if (A === B && A !== C && B !== D) o2 = B;
    if (D === C && D !== B && C !== A) o3 = C;
    if (B === D && B !== A && D !== C) o4 = D;
    out[2*y][2*x] = o1; out[2*y][2*x + 1] = o2; out[2*y + 1][2*x] = o3; out[2*y + 1][2*x + 1] = o4;
  }

}
const HD_SPRITES = new Map();
function spriteHD(g, rows, colors, X, Y){
  const key = rows.join('/') + JSON.stringify(colors);
  let cv = HD_SPRITES.get(key);
  if (!cv){
    const up = epx(rows), h = up.length, w = up[0].length;
    cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cg = cv.getContext('2d');
    const edge = ch => ch === undefined || ch === '.' || ch === 'k';
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const ch = up[y][x], col = colors[ch];
      if (!col) continue;
      let c = col;
      if (!colors._flat && ch !== 'k' && ch !== 'e'){
        if (edge(up[y - 1]?.[x])) c = css(mixA(rgb(col), [255, 240, 214], .3));
        else if (edge(up[y + 1]?.[x]) || edge(up[y][x + 1])) c = css(mixA(rgb(col), [26, 16, 64], .35));
      }

function ck(g){
  const R = v => Math.round(v * HD);

    g,
    rect(x, y, w, h, c){ g.fillStyle = c; g.fillRect(R(x), R(y), Math.max(1, R(w)), Math.max(1, R(h))); },
    px(x, y, c){ k.rect(x, y, 1, 1, c); },
    dot(x, y, c){ g.fillStyle = c; g.fillRect(R(x), R(y), 1, 1); },
    circle(cx, cy, r, c){
      g.fillStyle = c; const X = R(cx), Y = R(cy), rr = Math.max(1, R(r));
      for (let y = -rr; y <= rr; y++){ const half = Math.floor(Math.sqrt(rr*rr - y*y)); g.fillRect(X - half, Y + y, half * 2 + 1, 1); }
    },
    sprite(rows, colors, x, y){ spriteHD(g, rows, colors, R(x), R(y)); },
    img(cv, x, y){ g.drawImage(cv, R(x), R(y)); },
    glow(cx, cy, r, c, a, ry = r){
      const cv = glowSprite(r, ry, c);
      g.globalAlpha = Math.max(0, Math.min(1, a));
      g.drawImage(cv, R(cx) - (cv.width >> 1), R(cy) - (cv.height >> 1));
      g.globalAlpha = 1;
    },
  };

  for (const b of list.baked ||= bakeClumps(list)) k.g.drawImage(b.cv, b.X + (still ? 0 : Math.round(WIND(b.cx, t) * b.amp)), b.Y);

// An outlined, shaded stroke along a polyline [[x, y, width], ...] (trunks, branches,
// roots). The outline goes down first, then the body, lit on the sunny side, with bark streaks.
function stroke(p, pts, rb, sun = -1){
  const disc = (cx, cy, r, f) => { const c = Math.ceil(r); for (let y = -c; y <= c; y++) for (let x = -c; x <= c; x++) if (x * x + y * y <= r * r + .3) f(cx + x, cy + y, x); };
  const walk = f => {
    for (let i = 0; i < pts.length - 1; i++){
      const [x0, y0, w0] = pts[i], [x1, y1, w1] = pts[i + 1], steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * HD));
      for (let s = 0; s <= steps; s++){ const t = s / steps; f(Math.round((x0 + (x1 - x0) * t) * HD), Math.round((y0 + (y1 - y0) * t) * HD), (w0 + (w1 - w0) * t) * HD / 2); }
    }
  };
  walk((cx, cy, r) => disc(cx, cy, r + .6, (X, Y) => p.put(X, Y, rb[0])));
  walk((cx, cy, r) => disc(cx, cy, Math.max(.4, r - .4), (X, Y, ox) => {
    const streak = hash2(X, Y >> 2, 17) < .22 ? -1 : 0;
    const o = ox * -sun;
    p.put(X, Y, rb[Math.max(1, Math.min(4, (o < -r * .25 ? 3 : o > r * .3 ? 1 : 2) + streak))]);
  }));
}

// A tree. s = {x, y (ground), h (trunk height), rx, ry (crown), pal, pal2, seed, lean, w,
// lobes, sun, blooms}. The crown is a few lobes of leaves: one on top of the leader and
// the rest on side limbs that leave the trunk at staggered heights, so sky and branches
// show through the gaps between them.
function treeModel(s){
  const key = 'T' + JSON.stringify(s);
  if (MODELS.has(key)) return MODELS.get(key);
  if (s.kind) return treeOfKind(s, key);
  const r = mulberry32(s.seed * 7919 + 3), lean = s.lean || 0, w = s.w || 3, sun = s.sun || -1;
  const fx = s.x + lean, fy = s.y - s.h, ccy = fy - s.ry * .45;
  const top = {x: fx + lean * .3 + (r() - .5) * s.rx * .2, y: ccy - s.ry * .3, rx: s.rx * .55, ry: s.ry * .5};
  const lobes = [top];
  for (let i = 0, n = s.lobes || 2 + Math.floor(r() * 2.5); i < n; i++){
    const side = i % 2 ? 1 : -1, d = .5 + r() * .2, lift = .15 + (i / n) * .35 + r() * .1;
    lobes.push({x: fx + side * s.rx * d, y: ccy + s.ry * (.35 - lift), rx: s.rx * (.45 + r() * .12), ry: s.ry * (.42 + r() * .12), side, h: .45 + (i / n) * .4});
  }
  const clumps = [];
  lobes.forEach((L, li) => clumps.push(...crownClumps(L.x, L.y, L.rx, L.ry, s.seed + li * 13, s.pal, s.pal2, s.blooms)));
  shadeClumps(clumps, fx, ccy, s.rx, s.ry, sun);   // the crown's top sways the most
  clumps.sort((a, b) => (a.cy - a.r * .3) - (b.cy - b.r * .3));
  // the trunk: a root flare, a gentle S, then the leader on up into the top lobe
  const mid = [s.x + lean * .5 + (r() - .5) * 1.5, s.y - s.h * .5], lead = [top.x, top.y + top.ry * .3];
  const trunk = [[s.x, s.y + .5, w * 1.9], [s.x + lean * .1, s.y - 2.5, w * 1.15], [mid[0], mid[1], w * .95], [fx, fy, w * .8], [lead[0], lead[1], w * .45]];
  const branches = [];
  for (const L of lobes.slice(1)){
    const f = L.h < .5 ? L.h * 2 : (L.h - .5) * 1.4;
    const [x0, y0, x1, y1] = L.h < .5 ? [mid[0], mid[1], fx, fy] : [fx, fy, lead[0], lead[1]];
    const bx = x0 + (x1 - x0) * f, by = y0 + (y1 - y0) * f, ex = L.x - L.side * L.rx * .15, ey = L.y + L.ry * .25;
    branches.push([[bx, by, w * .6], [bx + (ex - bx) * .55, by + (ey - by) * .35 - 1, w * .42], [ex, ey, w * .26]]);
    // twigs inside the lobe, to show through the gaps
    for (let t = 0; t < 2; t++){
      const a = -Math.PI / 2 + L.side * (.3 + r() * .9);
      branches.push([[ex, ey, w * .24], [ex + Math.cos(a) * L.rx * .45, ey + Math.sin(a) * L.ry * .45, w * .12]]);
    }
  }
  const roots = [-1, 1].map(d => [[s.x + d * w * .4, s.y - .8, w * .8], [s.x + d * w * 1.6, s.y + .2, w * .4], [s.x + d * w * 2.6, s.y + .6, .5]]);
  const m = {s, cx: fx, topY: fy, clumps, trunk, branches, roots};
  MODELS.set(key, m); return m;
}

// Trees that aren't the same tree. Each kind grows its own way: where it forks, how thick it is, how its limbs go,
// and what shape that gives its crown. s.kind is one of these, and s is otherwise what treeModel takes.
const BARKS = {
  cherry: ['#1e0f0e', '#3a1e1c', '#553028', '#6e4030', '#8e5a42'],
  birch: ['#3a3438', '#8e887a', '#c6c0b0', '#e6e2d4', '#fdfbf0'],
  poplar: ['#1c1612', '#33291e', '#4a3c2a', '#62503a', '#7c684c'],
};
const TREE_KINDS = {
  // an old oak: short and enormously thick, and it forks low into heavy limbs that go out more than up, for a crown wider than it's tall
  oak(s, r){
    const w = s.w || 5, fx = s.x + (s.lean || 0), fy = s.y - s.h, ccy = fy - s.ry * .5, n = s.lobes || 6, lobes = [], branches = [];
    for (let i = 0; i < n; i++){
      const a = Math.PI * (1.02 + (i + .5) / n * .96) + (r() - .5) * .18, d = .54 + r() * .16;
      lobes.push({x: fx + Math.cos(a) * s.rx * d, y: ccy + Math.sin(a) * s.ry * d * .92, rx: s.rx * (.34 + r() * .1), ry: s.ry * (.36 + r() * .1)});
    }
    for (const L of lobes){
      const ex = L.x, ey = L.y + L.ry * .3, mx = fx + (ex - fx) * .6, my = fy + (ey - fy) * .22;
      branches.push([[fx, fy + 1.5, w * .6], [mx, my, w * .4], [ex, ey, w * .2]]);
      for (let t = 0; t < 2; t++){ const a = -Math.PI / 2 + (r() - .5) * 2.2; branches.push([[ex, ey, w * .16], [ex + Math.cos(a) * L.rx * .5, ey + Math.sin(a) * L.ry * .5, w * .08]]); }
    }
    lobes.push({x: fx + (r() - .5) * s.rx * .2, y: ccy + s.ry * .02, rx: s.rx * .46, ry: s.ry * .4});
    return {lobes, branches, trunk: [[s.x, s.y + .5, w * 1.9], [s.x + .2, s.y - 2, w * 1.25], [(s.x + fx) / 2, s.y - s.h * .6, w], [fx, fy, w * .95]], flare: w, cx: fx, cy: ccy};
  },
  // a cherry: it forks low and opens like a vase, its limbs arching out and carrying the blossom in flat layers, with dark gaps between them
  cherry(s, r){
    const w = s.w || 3.2, fx = s.x + (s.lean || 0), fy = s.y - s.h, lobes = [], branches = [];
    for (const [dir, reach, lift] of [[-1, 1, .42], [-.5, .66, .92], [.1, .22, 1.16], [.62, .7, .96], [1, 1, .5]]){
      const ex = fx + dir * s.rx * reach * (.86 + r() * .14), ey = fy - s.ry * lift * (.9 + r() * .2), mx = fx + (ex - fx) * .42, my = fy + (ey - fy) * .62;
      branches.push([[fx, fy + 1, w * .62], [mx, my, w * .42], [ex, ey, w * .16]]);
      for (const f of [.46, .74, 1]){
        lobes.push({x: fx + (ex - fx) * f, y: fy + (ey - fy) * f - s.ry * .06, rx: s.rx * (f === 1 ? .36 + r() * .08 : .3), ry: s.ry * (.22 + r() * .07)});
        const bx = fx + (ex - fx) * f, by = fy + (ey - fy) * f;
        branches.push([[bx, by, w * .14], [bx + dir * s.rx * .24 + (r() - .5) * 6, by - s.ry * .1 - r() * 3, w * .07]]);
      }
    }
    return {lobes, branches, trunk: [[s.x, s.y + .5, w * 1.6], [s.x + (fx - s.x) * .4, s.y - s.h * .5, w], [fx, fy, w * .9]], flare: w * .8, cx: fx, cy: fy - s.ry * .7, bark: BARKS.cherry};
  },
  // a birch: slim white stems out of one root, and a light, narrow crown of small leaves
  birch(s, r){

    for (let i = 0; i < n; i++){

      for (let j = 0; j < 5; j++){
        const f = .4 + j * .15, x = s.x + side * 1.5 + (tx - s.x - side * 1.5) * f, y = s.y - tall * f, ww = s.rx * [.34, .42, .36, .26, .16][j] * (.85 + r() * .3);

        for (const d of [-1, 1]) branches.push([[x, y, w * .3], [x + d * ww * .9, y + 1.5 + r() * 2.5, w * .1]]);
      }
    }
    const [trunk, ...rest] = stems;
    for (const q of rest) q.stem = true;
    return {lobes, branches: [...rest, ...branches], trunk, flare: 0, cx: s.x, cy: s.y - s.h * .68, ccry: s.h * .36, bark: BARKS.birch, marks: true};
  },
  // a Lombardy poplar: a tall flame of a tree, its limbs held in against the stem, so it has no crown to speak of, only a shape
  poplar(s, r){

    for (let y = top + 1; y < base;){
      const u = (y - top) / (base - top), half = s.rx * Math.pow(Math.sin(Math.PI * Math.min(1, u * .96 + .04)), .6) * (u > .75 ? 1 - (u - .75) * .8 : 1);

  shadeClumps(clumps, t.cx, t.cy, s.rx, t.ccry || s.ry, sun);
  clumps.sort((a, b) => (a.cy - a.r * .3) - (b.cy - b.r * .3));
  const roots = t.flare ? [-1, 1].map(d => [[s.x + d * t.flare * .4, s.y - .8, t.flare * .8], [s.x + d * t.flare * 1.6, s.y + .2, t.flare * .4], [s.x + d * t.flare * 2.6 + (r() - .5), s.y + .6, .5]]) : [];
  const m = {s, cx: s.x, topY: s.y - s.h, clumps, trunk: t.trunk, branches: t.branches, roots, bark: t.bark, marks: t.marks, shadow: t.shadow};
  MODELS.set(key, m); return m;
}

// Paint a tree's shade, roots, branches and trunk into the background.
function paintTree(p, m){
  const s = m.s, rb = (m.bark || PAL_BARK).map(rgb), wide = m.shadow ?? s.rx;
  p.ellipse(m.cx, s.y + .6, wide * .95, 2, 'rgba(10,30,15,.26)');
  p.ellipse(m.cx, s.y + .4, wide * .55, 1.3, 'rgba(10,30,15,.24)');
  const sun = s.sun || -1;
  for (const b of m.branches) stroke(p, b, rb, sun);
  for (const rt of m.roots) stroke(p, rt, rb, sun);
  stroke(p, m.trunk, rb, sun);
  // a birch's black marks, across the stem and wider low down
  if (m.marks) for (const stem of [m.trunk, ...m.branches.filter(b => b.stem)]){
    for (let i = 0; i < stem.length - 1; i++){
      const [x0, y0, w0] = stem[i], [x1, y1] = stem[i + 1];
      for (let f = 0; f < 1; f += 1 / Math.max(2, Math.abs(y1 - y0) * HD)){
        const y = y0 + (y1 - y0) * f, x = x0 + (x1 - x0) * f;
        if (hash2(Math.round(y * HD), i, 83) < .16) p.rect(x - w0 * .4 + hash2(Math.round(y * HD), 2, 83) * w0 * .3, y, w0 * (.3 + hash2(Math.round(y * HD), 3, 83) * .4), .5, '#231e24');
      }
    }
  }
}

// Shade each clump by where it sits in a crown (sunny top side bright, far bottom side dark).
function shadeClumps(clumps, cx, cy, rx, ry, sun = -1, amp = 1){
  for (const c of clumps){
    const u = (c.cx - cx) / rx, v = (c.cy - cy) / ry;
    c.shade = Math.max(-1, Math.min(1, Math.round(-(u * -sun * .6 + v * .9))));
    c.amp = (.4 + Math.max(0, -v + .6) * 1.1) * amp;
    c.sun = sun;
  }
  return clumps;
}

// A bush: a low crown sitting on the ground. s = {x, y (ground), w, h, pal, pal2, seed, blooms, sun}
function bushModel(s){
  const key = 'B' + JSON.stringify(s);
  if (MODELS.has(key)) return MODELS.get(key);
  const cy = s.y - s.h * .5, clumps = crownClumps(s.x, cy, s.w / 2, s.h / 2, s.seed, s.pal, s.pal2, s.blooms);
  const m = {s, clumps: shadeClumps(clumps, s.x, cy, s.w / 2, s.h / 2, s.sun || -1, .5)};
  MODELS.set(key, m); return m;
}

// A hedge: a back row of bigger clumps and a front row of smaller ones along a line, its
// top uneven. s = {x0, x1, y (base), h, pal, pal2, seed, blooms, sun}
function hedgeModel(s){
  const key = 'H' + JSON.stringify(s);
  if (MODELS.has(key)) return MODELS.get(key);
  const r = mulberry32(s.seed * 53 + 1), clumps = [];
  for (const [row, yf, sz] of [[1, .62, .42], [0, .3, .32]]){
    for (let x = s.x0 + (row ? 0 : 3); x < s.x1;){
      const rad = s.h * sz * (.8 + r() * .45);
      clumps.push({cx: Math.min(x, s.x1 - rad * .6), cy: s.y - s.h * yf + (r() - .5) * s.h * .18, r: rad, row});
      x += rad * (1.05 + r() * .45);
    }
  }
  // the back row goes down first, then the front row over it
  clumps.sort((a, b) => b.row - a.row || a.cy - b.cy);
  clumps.forEach((c, i) => { c.variant = (s.seed + i * 5) % 29; c.pal = i % 3 ? s.pal : (s.pal2 || s.pal); c.blooms = s.blooms; });
  const m = {s, clumps: shadeClumps(clumps, (s.x0 + s.x1) / 2, s.y - s.h * .5, (s.x1 - s.x0) / 2, s.h / 2, s.sun || -1, .6)};
  for (const c of m.clumps) c.shade = Math.max(-1, Math.min(1, Math.round(-((c.cy - (s.y - s.h * .5)) / (s.h / 2)) * .9)));
  MODELS.set(key, m); return m;
}

// Ivy roots where a wall meets the ground and climbs. Its stems fork and wander upward, thinning out, and its leaves follow
// them, thickest low down, so no patch of leaves ever hangs on a wall with nothing holding it there.
// o: stems, leaf (its size in pixels), sun (the side the light's on), pal, avoid(X, Y) to keep it off the glass
function ivyClimb(p, x, baseY, h, seed, o = {}){
  const r = mulberry32(seed), big = o.leaf === 3, sun = o.sun ?? 1, avoid = o.avoid || (() => false), Y0 = Math.round(baseY * HD), H = Math.round(h * HD), X0 = Math.round(x * HD);
  const pal = (o.pal || PAL_IVY).map(rgb), stem = rgb(o.stem || '#0b1416'), bark = rgb(o.bark || '#1a2018'), nodes = [], tips = [];
  for (let i = 0, n = o.stems || 3; i < n; i++) tips.push({X: X0 + Math.round((i - (n - 1) / 2) * (2 + r() * 4)), Y: Y0, left: H * (.5 + r() * .5), lean: (r() - .5) * .5, gen: 0});
  while (tips.length){
    const t = tips.pop();
    while (t.left-- > 0){
      t.Y--;
      t.lean = clamp(t.lean + (r() - .5) * .3, -.55, .55);
      if (r() < Math.abs(t.lean)) t.X += Math.sign(t.lean);
      if (avoid(t.X, t.Y)){ if (t.gen) break; t.X += t.lean < 0 ? -2 : 2; continue; }
      p.put(t.X, t.Y, stem);
      if (!t.gen && t.left > H * .35){ p.put(t.X + 1, t.Y, bark); }
      nodes.push([t.X, t.Y, t.left]);
      if (t.gen < 3 && r() < .07) tips.push({X: t.X, Y: t.Y, left: t.left * (.4 + r() * .55), lean: t.lean + (r() < .5 ? -.45 : .45), gen: t.gen + 1});
    }
  }
  nodes.sort((a, b) => a[1] - b[1]);
  for (const [X, Y, left] of nodes){
    const low = 1 - (Y0 - Y) / H;
    if (r() > .42 + low * .5) continue;
    for (let n = 0, m = 1 + Math.floor(r() * (1.6 + low * 2)); n < m; n++){
      const LX = X + Math.round((r() - .5) * (big ? 9 : 6) * (.6 + low * .7)), LY = Y + Math.round((r() - .5) * (big ? 5 : 3));
      if (avoid(LX, LY)) continue;
      const lit = (sun > 0 ? LX >= X : LX <= X) ? 1 : 0, v = clamp(1 + Math.floor(r() * 2.4) + lit, 0, pal.length - 1), c = pal[v], top = pal[Math.min(pal.length - 1, v + 1)], under = pal[Math.max(0, v - 1)];
      if (big){
        for (const [dx, dy, col] of [[-2, 0, c], [-1, -1, top], [0, -1, top], [1, -1, c], [-1, 0, c], [0, 0, c], [1, 0, c], [2, 0, under], [-1, 1, under], [0, 1, c], [1, 1, under], [0, 2, under]]) p.put(LX + dx, LY + dy, col);
      } else for (const [dx, dy, col] of [[-1, 0, c], [0, 0, c], [1, 0, under], [0, -1, top], [0, 1, under]]) p.put(LX + dx, LY + dy, col);
    }
  }
}
// Distant trees, painted straight into the background: too far away to sway.
function paintFarTrees(p, x0, x1, base, pal, seed, sun = -1){
  const r = mulberry32(seed);
  for (let x = x0; x < x1;){
    // some trees are just a mound, others stand taller with a clump or two stacked on top
    const rad = 3 + r() * 3.5, tiers = r() < .45 ? 1 : r() < .7 ? 2 : 3, y = (typeof base === 'function' ? base(x) : base) - rad * .6 - r() * 2;
    for (let i = 0; i < tiers; i++){
      const rr = rad * (1 - i * .22), cv = leafClump(rr, pal, Math.floor(r() * 29), i ? 1 : 0, null, sun);
      p.blit(cv, x + (r() - .5) * 2, y - i * rad * .9, cv.M);
    }
    x += rad * (1 + r() * .6);
  }
}

// ======== grass and flowers ========
// ---------- grass, flowers and things that sway ----------
// The lawn's body is painted once: broad sunlit and shaded patches brushed with
// thousands of little blade tufts. Its top edge is a fringe of tufts drawn every
// frame, leaning with the wind as gusts roll across, and flowers on stems sway with it.

// grass palette, deep → tip: [deep, dark, mid, light, bright, tip]
const PAL_GRASS = ['#2c3b34','#3a5c4c','#3f8a50','#55a65a','#76cc5c','#a6e272'];
const PAL_GRASS_NIGHT = ['#050c0a','#081310','#0c1a14','#11241a','#183020','#244232'];
const PAL_DUNE  = ['#4a4a2a','#6a6a36','#8a8a44','#a8a456','#c4bc6a','#e0d68a'];

// One fan of pointed grass blades rooted at (X, Y), in device pixels. lv (0..3) is the
// light level where it grows: blades are one step lighter than the ground under them, and
// big tufts get a lit left edge and bright tips. lean (-1..1) bends the whole fan.
function grassFan(put, rp, X, Y, size, lv, lean, r){
  const big = size >= 6, n = size < 4 ? 2 : big ? 3 + Math.floor(r() * 3) : 3;
  const body = rp[Math.min(5, lv + 1)], edge = rp[Math.min(5, lv + 2)], tip = rp[Math.min(5, lv + 2 + (lv >= 2 && big ? 1 : 0))];
  const blades = [];
  for (let b = 0; b < n; b++){
    const u = (b / (n - 1)) * 2 - 1;
    blades.push({u, ang: u * (.5 + r() * .3) + lean * .3 + (r() - .5) * .2, bend: u * .6 + lean * .4,

// Flowers seen from a little above: five round petals around a heart, a darker crease

// The lean (-2..2, in half steps) a blade at x has right now.
const leanAt = (x, t, gain = 1.7) => clamp(Math.round((WIND(x) * gain + .08) * 2) / 2, -2, 2);

// A row of tufts along an edge (edge(x) → y). Tall clumps alternate with lower stretches.
// opts: size (device px), lv (light level), dense, depth (scatter below the edge, logical px)
function fringe(edge, x0, x1, seed, opts = {}){
  const r = mulberry32(seed), list = [], base = opts.size || 6;

    list.push({x, y: edge(x) + .5 + r() * (opts.depth || 0), v: Math.floor(r() * 9), size: Math.max(3, Math.round(base * (.55 + clump * .8 + r() * .2))), lv: opts.lv ?? 2});

    const cv = tuftSprite(tf.v, still ? 0 : leanAt(tf.x + tf.v * 2.5 - 10, t, 1.3 + tf.v * .09), pal, tf.size, tf.lv);
    k.g.drawImage(cv, Math.round(tf.x * HD) - cv.ax, Math.round(tf.y * HD) - cv.ay);

// Little patches of flowers: a few heads of one kind growing together, bigger toward the

function flowerPatches(x0, x1, y0, y1, n, kinds, seed, opts = {}){
  const r = mulberry32(seed), list = [];
  for (let i = 0, tries = 0; i < n && tries < n * 20; tries++){
    const cx = x0 + r() * (x1 - x0), cy = y0 + r() * (y1 - y0), kind = kinds[Math.floor(r() * kinds.length)];
    if (opts.avoid && opts.avoid(cx, cy)) continue;

// ---- dark leaves framing the bottom corners ----

// pal: [outline, body, lit edge, rim]
const PAL_FROND = ['#160c12','#2a1a22','#3c2832','#584050'];
const PAL_FROND_NIGHT = ['#04050a','#090b14','#10141f','#1a2030'];
const PAL_FROND_GREEN = ['#0a1410','#14241c','#20362a','#30503a'];

const FRONDS = new Map();
function frondSprite(lean, pal, seed, W = 96, H = 76){
  const key = `${lean}|${pal[1]}|${seed}|${W}`;

  }

    for (const pass of [0, 1]) for (const [x, y, t, a] of pts){

      for (let o = -half; o <= half; o += .5){
        const X = Math.round(x + nx * o), Y = Math.round(y + ny * o);
        if (pass === 0){ p.put(X, Y, rp[0]); continue; }
        // the upper edge catches the sky; a dark rib runs down the middle of the wider blades
        const side = o * up / Math.max(.5, half);

}
// fronds in both bottom corners (the right one mirrored)
function drawFronds(k, t, still, pal = PAL_FROND, seeds = [3, 8]){
  const g = k.g;
  const L = frondSprite(still ? 0 : leanAt(8, t), pal, seeds[0]);
  g.drawImage(L, -6, DH - L.height);
  const R = frondSprite(still ? 0 : -leanAt(SW - 8, t), pal, seeds[1]);
  g.save(); g.translate(DW + 6, 0); g.scale(-1, 1); g.drawImage(R, 0, DH - R.height); g.restore();

// ======== birds ========
// ---- birds that fly in, land, potter about and fly off again ----

  robin:   {b:'#6e4c38', B:'#4e3426', r:'#e2683a', R:'#f69a5c', w:'#efe2cc', o:'#e8b040', e:'#0a0606', l:'#3a2418', k:'#24140e'},
  sparrow: {b:'#86603e', B:'#5a3e28', r:'#c8b498', R:'#ded0b8', w:'#eee6d6', o:'#5a4a3a', e:'#0a0606', l:'#4a3628', k:'#26180e'},
  blue:    {b:'#4a78c8', B:'#2e4e94', r:'#e8945a', R:'#f8b47a', w:'#f2ece0', o:'#2a2a3a', e:'#0a0606', l:'#2a2a3a', k:'#141a2e'},
  gull:    {b:'#e8eaf2', B:'#9aa2b8', r:'#ffffff', R:'#ffffff', w:'#ffffff', o:'#f0b030', e:'#141418', l:'#e09030', k:'#3a3e52'},
  pigeon:  {b:'#8a8aa0', B:'#6a6a82', r:'#9a8aa8', R:'#b0a6c0', w:'#a8a8bc', o:'#e0a0a0', e:'#ff7040', l:'#d0702a', k:'#2e2e40'},

  return Math.hypot(x - x0 - dx * t, y - y0 - dy * t) <= w;
};
// shapes in a 14×11 box, feet on the bottom row; each returns a colour key or ''
const BIRD_FRAMES = {
  perch(x, y){
    if (x > 11.3 && x < 13.6 && y > 3.6 && y < 4.8) return 'o';
    if (inE(x, y, 9.8, 3.8, 2.2, 2.1)) return x > 10.4 && x < 11.4 && y > 2.6 && y < 3.6 ? 'e' : y > 4.6 && x > 9.8 ? 'r' : 'b';
    if (inE(x, y, 7, 6.6, 4.3, 2.8)) return x > 6.8 && y > 5 ? (y > 8 ? 'w' : x > 9 && y < 6.6 ? 'R' : 'r') : y > 8.2 ? 'w' : x < 7.2 && y < 7.6 ? 'B' : 'b';
    if (nearSeg(x, y, 3.2, 7, .9, 9.6, .9)) return 'B';
    if ((Math.abs(x - 6.6) < .5 || Math.abs(x - 8.4) < .5) && y > 9 && y < 11) return 'l';
    return '';
  },
  peck(x, y){
    if (x > 12.3 && x < 13.6 && y > 7.4 && y < 9.6) return 'o';
    if (inE(x, y, 10.8, 7, 2.1, 2)) return x > 11.4 && x < 12.4 && y > 6 && y < 7 ? 'e' : 'b';
    if (inE(x, y, 7, 6.6, 4.3, 2.8)) return x > 7 && y > 6 ? (y > 8 ? 'w' : 'r') : y > 8.2 ? 'w' : x < 7.2 && y < 7.6 ? 'B' : 'b';
    if (nearSeg(x, y, 3.2, 6.2, .9, 4.4, .9)) return 'B';

  down(x, y){ return BIRD_FRAMES.fly(x, y, 1); },

    if (x > 12.6 && x < 14 && y > 4.6 && y < 5.6) return 'o';
    if (inE(x, y, 11, 4.8, 1.9, 1.8)) return x > 11.4 && x < 12.4 && y > 3.6 && y < 4.6 ? 'e' : 'b';
    if (inE(x, y, 7.2, 5.8, 4.4, 1.9)) return y > 6.4 ? (x > 7.5 ? 'r' : 'w') : 'b';

    if (inE(x, y, 10.2, 4.6, 2, 1.9)) return x > 10.6 && x < 11.6 && y > 3.4 && y < 4.4 ? 'e' : 'b';
    if (inE(x, y, 7, 6.4, 3.8, 2.6)) return x > 7 && y > 5.4 ? 'r' : 'b';

    if ((Math.abs(x - 7) < .5 || Math.abs(x - 8.6) < .5) && y > 8.6 && y < 10.4) return 'l';
    return '';
  },
};
const BIRDS = new Map();
function birdSprite(kind, frame, dir){
  const key = `${kind}|${frame}|${dir}`;

// A gull a long way off isn't a little bird, it's long wings bent at the wrist, and you'd know it anywhere. Strokes out from the
// shoulder, dark toward the tips, with the low sun along the top of the near part of each wing.
const GULL_WINGS = {
  glide: [[[8, 4], [4, 4], [0, 7]], [[16, 4], [20, 4], [24, 7]]],
  lift: [[[8, 5], [4, 4], [1, 3]], [[16, 5], [20, 4], [23, 3]]],

const GULLS = new Map();

  const key = frame + dir + (small ? 's' : '');
  if (GULLS.has(key)) return GULLS.get(key);
  const sc = small ? .62 : 1, W = Math.ceil(25 * sc), H = Math.ceil(12 * sc), p = painter(W, H), S = [12 * sc, 7 * sc], px = (x, y, c) => p.put(dir > 0 ? Math.round(x) : W - 1 - Math.round(x), Math.round(y), rgb(c));

// A flock that visits a set of perches. perches: [{x, y, ground}] (feet position, logical).

  const flock = drifting(key, n, i => ({state: 'away', wait: 2 + i * 5 + Math.random() * 6, kind: kinds[i % kinds.length], x: -20, y: 0, dir: 1}));
  const taken = new Set(flock.filter(b => b.state !== 'away').map(b => b.perch));

    if (b.state === 'away'){

      let free = perches.filter(q => !taken.has(q));

      b.perch = q; taken.add(q);

      b.from = {x: fromLeft ? -16 : SW + 16, y: 8 + Math.random() * 40};

// a cat: walking, sitting, loafing or in mid-jump. It faces right; dir flips it.

    if (nearSeg(x, y, 3.8, 12.8, .8, 11.4 - tail, .75)) return 'o';
    return '';

    const h = head(x, y, 19.6, 4.4); if (h) return h;

    if (nearSeg(x, y, 16.5, 8, 21, 8.4, .8) || nearSeg(x, y, 6, 11, 1.5, 13.4, .8)) return 'O';

    return '';

    if (nearSeg(x, y, 4.6, 10, 4.6 - b, 14.6, .6)) return 'O';

// A cloud in the water is the same cloud upside down, but water doesn't hold a clean edge: a row at a time, each one nudged, with gaps.
function cloudMirror(c){

  const g = M.getContext('2d');

// Clouds drifting across, each going through its own life: gathering, swelling or thinning, and

// bank, wisp, scrap), then sun or moon {x, y, r} to light each one from wherever it hangs, with a
// bright edge on any that pass close by, or light {side, under, sunX, gain}. Returns how much of

function cloudDeck(k, t, dt, key, o){

// Stars are drawn fresh each frame so that each can twinkle at its own pace, and the whole

const STAR_RAMP = ['#4a4e88', '#7a7eb8', '#aab0e0', '#d8dcf8', '#ffffff'];

  const list = pst[key] ||= (() => { const r = mulberry32(seed); return Array.from({length: n}, () => ({x: r() * DW, y: Math.floor(r() * maxY * HD), b: r() * r(), sp: .8 + r() * 3.4, ph: r() * 9, keen: r() < .4})); })();

// ======== once in a while ========

    if (st.now(k, t, dt) === false){ st.now = null; st.wait = lerp(gap[0], gap[1], Math.random()); }
  } else if (!reduceMotion && (st.wait -= dt) <= 0){

// ======== creatures ========
// ---- creatures, drawn from shapes ----
// Like the birds: each pose is a function from a point to a colour letter, sampled into a tiny
// sprite and given an outline. pal: {letter: colour}, with k for the outline. thin lists the
// letters that get no outline (slim legs and the like). Facing right; flipped when dir < 0.
const SHAPES = new Map();
function shapeSprite(id, W, H, fn, pal, dir = 1, thin = ''){

// ======== sights in a night sky ========
// ---- sights in a night sky ----
function cometSight(){

<script>
// The nearest ground is painted in the page's own colour on purpose, so that the scene has no bottom edge.
window.PAINTED_PIXELS_EXCUSES = {C5: "the ground melts into the page"};

// ===== Dusk at the cabin =====
//
// Walking the place first, because it decides everything else.
//
// The light.  The sun has just gone down behind the notch in the far range (SUN). It's low, it's on
//             the right, and everything with a view of the west catches rose on the side facing it.
//             Peaks away from the notch still get the very last direct sun, on their sunward faces,
//             and that goes out from the bottom up. Peaks either side of the notch are backlit.
//             The second light is warm, low and local: a lantern and the windows (see lanAt, winAt).
// The key.    Violet and rose over blue snow. The one accent is amber: the windows, the lantern, and
//             far off, the same gold in the notch. Her red hat is the only other strong colour.
// The depth.  Sky; moon and stars; cloud, high and low. Far range, near range. Forested ridges, the frozen
//             lake, the village. The hill, the woods on it, the cabin. Her. Near snow, dry grass, the
//             two great pines at our shoulders. Each of those moves on scroll by how far away it is.
// What moves. One wind: snow, smoke, spindrift, powder off the boughs, her hair and steam, the lantern,
//             the grass, the near pines. Otherwise: her own small life, and the clock. The dusk
//             deepens over about six and a half minutes and stays in the blue hour.
// What lives. Chickadees at the feeder, a cat on the sill, someone indoors, crows going home to the
//             woods. Later an owl on the dead larch. Now and then a fox hunting mice under the snow,
//             a doe, a hare, the evening train along the far shore. One at a time, never on cue.
// What she does.  Holds the mug. Sips it, blows on it, warms her hands, watches the snow, catches a
//             flake, looks round at the lit window. Says hello to whoever just arrived.

//

function curve(pts){

    const m0 = i ? (y1 - pts[i - 1][1]) / (x1 - pts[i - 1][0]) : (y1 - y0) / (x1 - x0);
    const m1 = i < pts.length - 2 ? (pts[i + 2][1] - y0) / (pts[i + 2][0] - x0) : (y1 - y0) / (x1 - x0);

function paintChimney(){
  const X0 = R2(CHIM.x - CHIM.w / 2), X1 = R2(CHIM.x + CHIM.w / 2), Y0 = R2(CHIM.top), Y1 = R2(CHIM.base);
  const stones = (X, Y) => {
    const row = Math.floor((Y - Y0) / 4), off = row % 2 ? 3 : 0, col = Math.floor((X - X0 + off) / 6), fx = (X - X0 + off) % 6, fy = (Y - Y0) % 4;

  for (let Y = Y0; Y <= Y1; Y++) for (let X = X0; X <= X1; X++){

}

// Windows light themselves, so they sit in their own layer, untouched by the dusk.
function paintPanes(p){
  const glass = (x0, y0, w, h, o = {}) => {
    const X0 = R2(x0), Y0 = R2(y0), W = R2(w), Hh = R2(h), rp = toRamp(o.ramp || ['#d8682c','#f08a38','#fbaa4a','#ffc866','#ffe08e','#fff2bc']);
    for (let j = 0; j < Hh; j++) for (let i = 0; i < W; i++){
      const u = i / (W - 1), v = j / (Hh - 1);
      // brighter at the top, where the lamp inside hangs; a room's dim warmth lower down
      let l = .95 - v * .62 - Math.abs(u - .5) * .24;
      p.put(X0 + i, Y0 + j, pickR(rp, l, X0 + i, Y0 + j));
    }
    if (o.curtain){
      // curtains drawn back on both sides, lit through
      for (let j = 0; j < Hh; j++){
        const tie = j / Hh, reach = Math.round((tie < .62 ? 2 + tie * 3 : 4.2 - (tie - .62) * 5) * (W / 26));
        for (let i = 0; i < reach; i++){ for (const X of [X0 + i, X0 + W - 1 - i]){ const fold = (i + (X < X0 + W / 2 ? 0 : 1)) % 3 === 0; p.put(X, Y0 + j, rgb(fold ? '#e8904a' : '#ffd08c')); } }
      }
    }
    if (o.sill){
      // things on the sill inside, dark against the light
      for (const [i, hh, w2] of o.sill) for (let j = 0; j < hh; j++) for (let q = 0; q < w2; q++) p.put(X0 + i + q, Y0 + Hh - 1 - j, rgb('#8a4424'));
    }
    // the bars
    const bar = rgb(o.bar || '#2a1826');
    for (const u of o.cols ?? [.5]) { const X = X0 + Math.round(u * W) - 1; for (let j = 0; j < Hh; j++){ p.put(X, Y0 + j, bar); p.put(X + 1, Y0 + j, bar); } }
    for (const v of o.rows ?? [.5]) { const Y = Y0 + Math.round(v * Hh) - 1; for (let i = 0; i < W; i++){ p.put(X0 + i, Y, bar); p.put(X0 + i, Y + 1, bar); } }
  };
  glass(WINDOW_F.x - WINDOW_F.w / 2, WINDOW_F.y - WINDOW_F.h / 2, WINDOW_F.w, WINDOW_F.h, {curtain: true, sill: [[17, 4, 2], [20, 2, 3]]});
  glass(ATTIC.x, ATTIC.y, ATTIC.w, ATTIC.h, {ramp: ['#a84e2c','#c86a34','#e08a42','#f0a858','#f8c070','#ffd890'], rows: [.5], cols: [.5]});
  glass(DOOR.x + 2.5, DOOR.y + 2.5, 7, 7.5, {rows: [.5], cols: [.5]});
  // the window in the long wall, skewed like the wall
  const u0 = 7, u1 = 16, v0 = 10, v1 = 19, rp = toRamp(['#c8602c','#e88038','#f8a048','#ffc060','#ffdc88']);
  for (let u = R2(u0); u <= R2(u1); u++){
    const X = R2(WX0) - u, lift = Math.floor(u / 3);
    for (let v = R2(v0); v <= R2(v1); v++){
      const Y = R2(DECK_B) + 1 - lift - v, fu = (u - R2(u0)) / (R2(u1) - R2(u0)), fv = (v - R2(v0)) / (R2(v1) - R2(v0));
      const frame = u < R2(u0) + 2 || u > R2(u1) - 2 || v < R2(v0) + 2 || v > R2(v1) - 2;
      const barU = Math.abs(fu - .5) < .07, barV = Math.abs(fv - .5) < .07;
      if (frame) p.put(X, Y, rgb(u < R2(u0) + 1 || v > R2(v1) - 1 ? '#3c2a42' : '#1c1428'));
      else if (barU || barV) p.put(X, Y, rgb('#241630'));
      else p.put(X, Y, pickR(rp, .3 + fv * .6, X, Y));
    }
  }
}

function nightOf(cv, mul, add){
  const out = blank(), c = out.getContext('2d'), src = cv.getContext('2d').getImageData(0, 0, DW, DH), d = src.data;
  for (let i = 0; i < d.length; i += 4){ if (!d[i + 3]) continue; d[i] = d[i] * mul[0] + add[0]; d[i + 1] = d[i + 1] * mul[1] + add[1]; d[i + 2] = d[i + 2] * mul[2] + add[2]; }

}

function boxOf(cv){

function paintWoods(){

    for (let x = x0; x < x1;){
      const gap = vnoise(x, 0, 40, seed) < (o.gaps ?? .2);       // clearings, so it isn't a comb
      const big = r() < .22, H = (o.h0 + (o.h1 - o.h0) * r()) * (big ? 1.25 : 1) * (o.shrink ? 1 - clamp((x - o.shrink[0]) / o.shrink[1], 0, 1) * .66 : 1);
      if (!gap) list.push({x, H, seed: Math.floor(x * 7 + seed)});
      x += (o.step0 + r() * o.step1) * (H / o.h1 * .5 + .5);

  };

  for (const t of far) snowPine(AMB, t.x, HILL(t.x) + 2 + (t.seed % 3), t.H, t.seed, {snow: hazed(PINE_SNOW, '#5a4a92', .5), needle: hazed(NEEDLE, '#3a3376', .62), tierH: 9});

  for (const [x, H] of stand) snowPine(AMB, x, HILL(x) + 7, H, Math.floor(x * 3 + 11), {load: .85, snow: hazed(PINE_SNOW, '#1c2050', .2)});
  const nearRow = [[8, 62], [34, 74], [62, 56], [80, 44], [212, 30], [228, 20], [244, 15]];

let layoutSoon = 0, drawn = 0;
let clock = 0;
const DUSK = {u: 0, owl: 0, owlT: 0, prowler: null};
// Two paintings of everything, an hour of light apart. The mix is kept and only remade when it has
// moved on by a visible step, one layer per frame, so the frame itself only ever draws one of each.
const FADE_STEPS = 128, FADE = {step: -1, jobs: []};
function fadeTick(u){
  const step = Math.round(u * FADE_STEPS);
  if (step !== FADE.step){ FADE.step = step; FADE.jobs = ['sky', 'mtn', 'ridges', 'land']; }
  const name = FADE.jobs.shift();
  if (!name) return;
  const L = LAYER[name], c = L.now.getContext('2d'), {x, y, w, h} = L.box;
  c.globalAlpha = 1; c.clearRect(x, y, w, h); c.drawImage(L.a, x, y, w, h, x, y, w, h);
  c.globalAlpha = FADE.step / FADE_STEPS; c.drawImage(L.b, x, y, w, h, x, y, w, h); c.globalAlpha = 1;
}
function drawWorld(g, t, dt, k){
  clock += dt;
  const u = DUSK.u = reduceMotion ? .1 : duskAt(clock), tint = (a, b) => css(mixA(rgb(a), rgb(b), u));
  fadeTick(u); if (!LAYER.ready){ while (FADE.jobs.length) fadeTick(u); LAYER.ready = 1; }   // the first frame has to be whole
  // as the page scrolls, far things hang back and near things hurry: the whole world has depth
  const cs = reduceMotion ? 0 : SCROLL * VIEW.dpr / VIEW.D, at = f => { g.setTransform(1, 0, 0, 1, -VIEW.x0, Math.round(cs * f)); };
  // ---- the sky ----
  at(0); g.fillStyle = '#0d0f30'; g.fillRect(VIEW.x0, 0, VIEW.w, Math.round(cs * .55) + 2);
  at(.55);
  blitBox(g, LAYER.sky.box, LAYER.sky.now);
  duskStars(k, t, u);
  drawMoon(k, t, u);
  if (u > .22) shootingStars(k, dt, 'shoot', 60, 420, 4, 40, [24, 70]);
  drawClouds(k, t, dt, u);
  SIGHT_REST -= dt;
  sight(k, t, dt, 'sky', skySights, [8, 40]);
  // ---- the mountains: the last sun climbs them and goes out ----
  at(.4);
  blitBox(g, LAYER.mtn.box, LAYER.mtn.now);
  if (u < .62){ g.globalAlpha = 1 - clamp((u - .45) / .17, 0, 1); blitBox(g, LAYER.alp, alpenglow(u)); g.globalAlpha = 1; }
  // ---- the valley ----
  at(.26);
  blitBox(g, LAYER.ridges.box, LAYER.ridges.now);
  drawVillage(k, t, u);
  sight(k, t, dt, 'valley', valleySights, [70, 170]);
  flakes(k, t, dt, 'flakeFar', 120, {size: 1, fall: 5, wind: 8, drift: .8, wob: 3, flut: .5, col: tint('#a79ccc', '#55568a'), floor: (x, q) => HILL(x) + q * 6});
  // ---- the hill, the cabin and its light ----
  at(0);
  blitBox(g, LAYER.land.box, LAYER.land.now);
  const flick = lanternFlick(t);
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = Math.min(1, .66 + flick * .3); blitBox(g, LAYER.ll);
  g.globalAlpha = .93 + (reduceMotion ? 0 : vnoise(t * .35, 8, 1, 10) * .07); blitBox(g, LAYER.lw);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  blitBox(g, LAYER.panes);
  windowLife(k, t, dt);
  drawGlints(k, t, u);
  drawPrints(k, dt);
  chimneySmoke(k, t, dt, !reduceMotion);
  owlLife(k, t, dt, u);
  sight(k, t, dt, 'hill', hillSights, [14, 60]);
  // birds keep the hours too: past the middle of dusk nothing new arrives, and they drift off to roost
  const perches = u > .5 ? NO_PERCHES : PERCH_LIST;
  const scare = (x, y) => DUSK.prowler && Math.hypot(x - DUSK.prowler.x, y - DUSK.prowler.y) < 30;   // they're off the moment the fox comes under them
  if (!reduceMotion){   // the kit's birds don't check for this themselves
    birdLife(k, t, dt, 'birds', 2, perches, ['chickadee'], {speed: 42, scare});
    birdLife(k, t, dt, 'cardinal', 1, perches, ['cardinal'], {speed: 42, scare});
    birdRest('birds', 14, 40); birdRest('cardinal', 70, 120);
  }
  windSnow(k, t, dt);
  porchHero(k, t, dt);
  drawBreath(k, t, dt);
  drawLantern(k, flick);
  sight(k, t, dt, 'near', nearSights, [30, 90]);
  flakes(k, t, dt, 'flakeMid', 100, {size: 1, fall: 9, wind: 16, drift: 1.2, wob: 5, flut: .7, col: tint('#dcd4ee', '#9c9ccc'), warm: true, floor: (x, q) => Math.max(HILL(x) + 6, 118 + q * 26)});
  // ---- the very near, locked to the view ----
  at(-.1);
  g.drawImage(VIEW.vig, VIEW.x0, 0);
  const narrow = clamp((640 - VIEW.w) / 280, 0, 1);
  drawNearPine(k, VIEW.left, VIEW.x0 - Math.round(VIEW.left.width * (.52 + narrow * .3)), DH - VIEW.left.height + 36, t, 1.4);
  drawNearPine(k, VIEW.right, VIEW.x0 + VIEW.w - Math.round(VIEW.right.width * (.38 - narrow * .16)), DH - VIEW.right.height + 36, t, 1.2);
  // the nearest snow is in the page's colour and in front of those pines, so nothing ends in a hard line
  g.drawImage(VIEW.near, VIEW.x0, 0);
  g.fillStyle = PAGE_BG; g.fillRect(VIEW.x0, DH - 1, VIEW.w, Math.round(cs * .1) + 2);
  drawStalks(k, t);
  flakes(k, t, dt, 'flakeNear', 30, {size: 2, fall: 17, wind: 30, drift: 2, wob: 8, flut: .9, col: tint('#f2ecf8', '#b4b4dc'), floor: () => 160});
  g.setTransform(1, 0, 0, 1, -VIEW.x0, 0);
}
let SCROLL = 0, onScreen = true;
addEventListener('scroll', () => { SCROLL = Math.max(0, window.scrollY); }, {passive: true});
// the scene comes up through a dither, like an old console game; only once, and not for reduced motion
const REVEAL = {t: reduceMotion ? 1 : 0, dur: .9, levels: []};
function revealMask(level){
  if (REVEAL.levels[level]) return REVEAL.levels[level];
  const c = Object.assign(document.createElement('canvas'), {width: 4, height: 4}), g = c.getContext('2d');
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (bay(x, y) + .47 >= level / 16){ g.fillStyle = '#000'; g.fillRect(x, y, 1, 1); }
  return REVEAL.levels[level] = g0.createPattern(c, 'repeat');
}
let last = 0;
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  // no one needs more frames than this, least of all a phone; and nothing at all when it's off screen
  if (!onScreen || now - drawn < (reduceMotion ? .12 : 1 / 45)) return;
  const dt = Math.min(.1, now - last); last = drawn = now;
  if (!reduceMotion) windTick(now, dt);
  const busy = life.act;
  lifeTick(dt, 'cabin', 'me', true);
  if (busy && !life.act) life.wait += 2 + Math.random() * 7;     // she's in no hurry
  g0.setTransform(1, 0, 0, 1, -VIEW.x0, 0);
  drawWorld(g0, now, dt, k0);
  lifeFxDraw(k0, dt);
  if (REVEAL.t < 1){
    REVEAL.t = Math.min(1, REVEAL.t + dt / REVEAL.dur);
    g0.setTransform(1, 0, 0, 1, 0, 0);
    g0.globalCompositeOperation = 'destination-out';
    g0.fillStyle = revealMask(Math.ceil(REVEAL.t * 16)); g0.fillRect(0, 0, VIEW.w, DH);
    g0.globalCompositeOperation = 'source-over';
  }
}
// tap her and she says hello again
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), s = VIEW.D / VIEW.dpr, x = (VIEW.x0 + (e.clientX - r.left) / s) / HD, y = (e.clientY - r.top) / s / HD;
  if (Math.abs(x - HERO.x - 7) < 13 && Math.abs(y - 101) < 13 && !life.act){ life.next = 'hello'; life.wait = 0; }
});
(async () => {
  // take up its full height straight away, so that nothing on the page jumps when it arrives
  layout();
  for (const step of PAINT_STEPS){ step(); await new Promise(go => setTimeout(go)); }
  SCROLL = Math.max(0, window.scrollY);
  addEventListener('resize', () => { clearTimeout(layoutSoon); layoutSoon = setTimeout(layout, 120); });
  if ('IntersectionObserver' in window) new IntersectionObserver(e => { onScreen = e[e.length - 1].isIntersecting; }).observe(cv);
  document.getElementById('splash')?.remove();
  last = drawn = performance.now() / 1000;
  life.awake = true;
  requestAnimationFrame(frame);
})();

</script>
</body>
